# ===============================
# APPLICATION CONFIG
# ===============================
spring.application.name=api-gateway
server.port=8084

# ===============================
# EUREKA CLIENT CONFIG
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# GATEWAY ROUTING CONFIG
# ===============================
spring.cloud.gateway.discovery.locator.enabled=false


# ===============================
# MANUAL ROUTES (RECOMMENDED)
# ===============================
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users,/users/**

spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=lb://course-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/courses,/courses/**

spring.cloud.gateway.routes[2].id=enrollment-service
spring.cloud.gateway.routes[2].uri=lb://enrollmet-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/enrollments,/enrollments/**

# ===============================
# JWT (FOR FILTER)
# ===============================
jwt.secret=your_secret_key_here