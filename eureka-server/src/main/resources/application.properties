# ===============================
# APPLICATION INFO
# ===============================
spring.application.name=eureka-server

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8761

# ===============================
# EUREKA SERVER CONFIGURATION
# ===============================

# This is a server, so it should not register itself
eureka.client.register-with-eureka=false

# This is a server, so it should not fetch registry
eureka.client.fetch-registry=false

# Eureka dashboard URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===============================
# OPTIONAL (BUT GOOD PRACTICE)
# ===============================

# Disable self-preservation mode (useful for development)
eureka.server.enable-self-preservation=false

# Interval for eviction (clean dead instances faster in dev)
eureka.server.eviction-interval-timer-in-ms=60000

# Logging (optional)
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO